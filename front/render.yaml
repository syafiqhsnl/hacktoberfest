services:
  - type: web
    name: bridgeflow
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: node run start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: 10000
